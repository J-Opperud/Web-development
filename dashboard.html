<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .task { display: flex; justify-content: space-between; align-items: center;
                padding: 12px; margin: 8px 0; background: #f8f8f8; border-radius: 6px; }
        .task.done { text-decoration: line-through; opacity: 0.6; }
        .add-form { display: flex; gap: 8px; margin: 20px 0; }
        .add-form input { flex: 1; padding: 10px; font-size: 1rem; }
        button { padding: 8px 16px; cursor: pointer; }
        .error { color: #e74c3c; }
        .stats { display: flex; gap: 20px; margin: 16px 0; }
        .stat { background: #e8f4fd; padding: 12px 20px; border-radius: 6px; text-align: center; }
        .stat .number { font-size: 1.5rem; font-weight: bold; color: #1a1a2e; }
</style>

</head> <body>
<h1>Task Manager</h1>

<div class="stats" id="stats"></div>

<div class="add-form">
    <input
        type="text"
        id="new-task"
        placeholder="Add a new task..."
    >
    <button id="add-btn">Add</button>
    <button id="refresh-btn">Refresh</button>
</div>

<div id="task-list"></div>

<p id="error" class="error"></p>

<div id="lastupdate"></div>

<script>

    const API = "http://localhost:8000";

    // DOM references
    const taskList = document.querySelector("#task-list");
    const lastupdate = document.querySelector("#lastupdate");
    const statsDiv = document.querySelector("#stats");
    const newTaskInput = document.querySelector("#new-task");
    const refreshBtn = document.querySelector("#refresh-btn");
    const addBtn = document.querySelector("#add-btn");
    const errorEl = document.querySelector("#error");


    // Load tasks
    async function loadTasks() {

        try {
            errorEl.textContent = "";

            const response = await fetch(`${API}/tasks`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const tasks = await response.json();

            taskList.innerHTML = tasks.map(task => `
                <div
                    class="task ${task.done ? 'done' : ''}"
                    data-id="${task.id}"
                >
                    <span>${task.title}</span>

                    <button onclick="toggleTask(${task.id})">
                        ${task.done ? 'Undo' : 'Complete'}
                    </button>
                </div>
            `).join("");

        } catch (error) {

            errorEl.textContent =
                "Could not load tasks. Is the API running?";
        }
    }


    // Load stats
    async function loadStats() {

        try {

            const response = await fetch(`${API}/stats`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            statsDiv.innerHTML = `
                <div class="stat">
                    <div class="number">${data.total}</div>
                    Total
                </div>

                <div class="stat">
                    <div class="number">${data.done}</div>
                    Done
                </div>

                <div class="stat">
                    <div class="number">${data.pending}</div>
                    Pending
                </div>
            `;

        } catch (error) {

            statsDiv.innerHTML =
                '<p class="error">Could not load stats</p>';
        }
    }


    // Add a task
    async function addTask() {
    const title = newTaskInput.value.trim();

    if (!title) return;

    console.log("Sending:", JSON.stringify({ title }));

        try {
            const response = await fetch(`${API}/tasks`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ title })
            });

            if (!response.ok) {
                const errorData = await response.json();

                console.log("Status:", response.status);
                console.log("FastAPI error:", errorData);

                throw new Error(`HTTP ${response.status}`);
            }

            newTaskInput.value = "";
            refreshDashboard();
            
        } catch (error) {
            console.error(error);
            errorEl.textContent = "Failed to add task";
        }
    }

    async function toggleTask(id) {
        try {
            const response = await fetch(`${API}/tasks/${id}`, {
                method: "PATCH"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await refreshDashboard();

        } catch (error) {
            console.error(error);
            errorEl.textContent = "Failed to update task";
        }
    }
    // Refresh the entire dashboard
    async function refreshDashboard() {

        await loadTasks();
        await loadStats();
        
        lastupdate.textContent =
            `Last updated: ${new Date().toLocaleTimeString()}`;
    }


    // Event listeners
    addBtn.addEventListener("click", addTask);

    refreshBtn.addEventListener("click", refreshDashboard);

    newTaskInput.addEventListener("keydown", (e) => {

        if (e.key === "Enter") {
            addTask();
        }

    });


    // Initial load
    refreshDashboard();


</script>

</body> </html>
